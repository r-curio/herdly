name: Feature request
description: Suggest new or changed behavior.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Agreed behavior is recorded in [docs/product.md](https://github.com/r-curio/herdly/blob/main/docs/product.md) and the [architecture decisions](https://github.com/r-curio/herdly/tree/main/docs/adr). Please check them first; a request that changes agreed behavior needs that agreement before code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What Herdly should do instead. Mention the part of docs/product.md it would change, if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
