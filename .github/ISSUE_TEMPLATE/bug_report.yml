name: Bug report
description: Something in Herdly doesn't work as described in docs/product.md.
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste transcripts, conversation content, tokens, or other secrets; describe what happened instead. Report security issues privately (see SECURITY.md), not here.
  - type: input
    id: herdly-version
    attributes:
      label: Herdly version
      description: Settings › About shows it.
      placeholder: 0.1.0 (123)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: Codex desktop, Codex CLI, Claude Code in a terminal, or Claude Desktop's Code tab, with its version.
      placeholder: Codex CLI 0.145.0
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal host
      description: For terminal sessions, the terminal and any multiplexer (Ghostty, iTerm2, Terminal.app, WezTerm, Rex, Herdr, tmux, Zellij, herdr). Leave empty for desktop apps.
      placeholder: Ghostty 1.3.1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Codex CLI session in a Ghostty tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Screenshots help; crop out conversation content.
    validations:
      required: true
